<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Unlocked</title>
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this for every path it has no file for, which
      includes the links the app shares: <origin>/e/<event id>. Before this
      page existed a shared story opened GitHub's own 404 — the one moment a
      new reader arrives, met with a dead end.

      The event id carries its date, year and article (evt-MM-DD-YEAR-slug),
      so the page can say what was shared without downloading the 16 MB
      archive. Everything is built with textContent: the path is whatever
      someone typed, and none of it is ever parsed as HTML.
    -->
    <style>
      :root { color-scheme: dark; --ink: #06080e; --raised: #11151f; --text: #e8eaf0; --dim: #9aa1b2; --accent: #e0a33c; --line: #232838; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 3rem 1.25rem;
        background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(224, 163, 60, 0.14), transparent 70%), var(--ink);
        color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 34rem; margin: 0 auto; text-align: center; }
      .kicker { color: var(--accent); letter-spacing: .22em; font-size: .8rem; font-weight: 700; text-transform: uppercase; }
      .year { font-size: clamp(3.5rem, 16vw, 5.5rem); font-weight: 800; line-height: 1; margin: .4rem 0 .6rem; color: var(--accent); }
      h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.2; margin: 0 0 1.2rem; }
      p { color: var(--dim); margin: 0 auto 1.5rem; max-width: 28rem; }
      .badge { display: inline-block; padding: .7rem 1.4rem; border-radius: 999px; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; text-decoration: none; }
      footer { margin-top: 3rem; font-size: .9rem; color: var(--dim); }
      footer a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker" id="kicker">History Unlocked</div>
      <div class="year" id="year" hidden></div>
      <h1 id="title">This page does not exist</h1>
      <p id="lead">But every day of the year has a story. Find them in History Unlocked.</p>
      <a class="badge" id="cta" href="/history-unlocked/">Coming soon to Google Play</a>
      <footer><a href="/history-unlocked/">History Unlocked</a> · what happened on today's date</footer>
    </main>
    <script>
      (function () {
        var m = /\/e\/(evt-(\d{2})-(\d{2})-(bce)?(\d+)-([a-z0-9-]+))\/?$/i.exec(location.pathname);
        if (!m) return;
        var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        var month = months[Number(m[2]) - 1];
        var day = Number(m[3]);
        if (!month || !day) return;
        var year = m[4] ? m[5] + ' BC' : m[5];
        var words = m[6].replace(/-/g, ' ');
        var title = words.charAt(0).toUpperCase() + words.slice(1);
        document.title = title + ' — ' + day + ' ' + month + ' ' + year + ' · History Unlocked';
        document.getElementById('kicker').textContent = 'On this day · ' + day + ' ' + month;
        var y = document.getElementById('year');
        y.textContent = year;
        y.hidden = false;
        document.getElementById('title').textContent = title;
        document.getElementById('lead').textContent =
          'Someone shared this story with you from History Unlocked — every day of the year, what happened on it, with the real pictures.';
      })();
    </script>
  </body>
</html>
