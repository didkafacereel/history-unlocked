# Generates today's event imagery + manifest.json into /docs and commits it.
# Serve /docs with GitHub Pages (Settings → Pages → main, /docs folder), then
# point the app at:  EXPO_PUBLIC_MANIFEST_URL=https://<user>.github.io/<repo>/manifest.json
#
# Optional repository settings:
#   vars.PUBLIC_BASE_URL  — public URL of the Pages site (defaults below)
#   secrets.HF_TOKEN      — switches image generation to Hugging Face FLUX
name: Daily manifest

on:
  schedule:
    - cron: '15 0 * * *' # 00:15 UTC, before most local midnights roll over
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-manifest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate imagery and manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npx tsx pipeline/generate.ts --out docs

      - name: Commit and push
        run: |
          git config user.name "history-unlocked-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "chore: daily manifest $(date -u +%F)"
            git push
          fi
